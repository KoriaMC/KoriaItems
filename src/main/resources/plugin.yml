name: KoriaItems
version: ${project.version}
main: fr.koriamc.items.KoriaItems
author: KoriaMC
description: "${project.description}"
softdepend: [KoriaFactions, KoriaJobs]

commands:
  koriaitems:
    description: Administration de KoriaItems
    aliases: [kitems]
    usage: /koriaitems [reload|enchant|charge|traqueur]
  cle:
    description: Clés des caisses (koala, tropique, spawners)
    aliases: [cles, key, keys]
    usage: /cle [give <joueur> <type> [nombre]]
  vision:
    description: Active ou désactive la vision nocturne
    aliases: [nv, nightvision]
    usage: /vision

permissions:
  koriaitems.admin:
    description: Commandes d'administration
    default: op
  koriaitems.vision:
    description: Utiliser /vision
    default: true
